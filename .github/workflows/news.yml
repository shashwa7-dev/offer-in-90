name: Daily news

on:
    schedule:
        # 04:30 IST every day = 23:00 UTC the previous day. GitHub can run up to an hour late.
        - cron: "0 23 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: content-commit
    cancel-in-progress: false

jobs:
    fetch:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            # Public APIs only (Hacker News, Lobsters, Hugging Face, dev.to, Simon Willison). No AI, no keys.
            - run: node scripts/fetch-news.mjs
            - id: commit
              run: |
                  if git diff --quiet -- public/news.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
                  git config user.name "offer-in-90 news"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/news.json
                  git commit -m "news: $(TZ=Asia/Kolkata date +%F)"
                  git pull --rebase origin main
                  git push origin HEAD:main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

    deploy:
        needs: fetch
        if: needs.fetch.outputs.changed == 'true'
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/deploy.yml
